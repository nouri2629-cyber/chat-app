<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان آنلاین</title>
    <!-- فونت وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #0f172a; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
        .header { padding: 15px; background: #334155; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 15px; border-bottom: 1px solid #334155; cursor: pointer; transition: 0.2s; }
        .chat-item:hover, .chat-item.active { background: #334155; }
        .main { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 70%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.5; position: relative; }
        .msg.sent { align-self: flex-start; background: #6366f1; border-bottom-right-radius: 0; }
        .msg.received { align-self: flex-end; background: #334155; border-bottom-left-radius: 0; }
        .input-area { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 25px; border: none; background: #0f172a; color: white; outline: none; }
        button { padding: 10px 20px; border-radius: 25px; border: none; cursor: pointer; font-family: inherit; font-weight: bold; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-icon { background: #334155; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
        .qr-box { background: white; padding: 10px; border-radius: 10px; display: inline-block; margin: 15px 0; }
        
        /* Invite Banner */
        .invite-banner { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #6366f1; padding: 15px 25px; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; gap: 15px; animation: slideDown 0.5s; }
        @keyframes slideDown { from { top: -100px; } to { top: 20px; } }
        
        .empty-state { margin: auto; text-align: center; color: #64748b; }
    </style>
</head>
<body>

    <!-- نوار دعوت -->
    <div id="inviteBanner" class="invite-banner">
        <span id="inviteText">دعوت به چت...</span>
        <button onclick="acceptInvite()" style="background: white; color: #6366f1; padding: 5px 15px;">پیوستن</button>
        <button onclick="document.getElementById('inviteBanner').style.display='none'" style="background: transparent; border: 1px solid white; color: white; padding: 5px 10px;">✕</button>
    </div>

    <!-- سایدبار -->
    <div class="sidebar">
        <div class="header">
            <span id="myNameDisplay">کاربر</span>
            <button onclick="createNewChat()" style="background: transparent; color: #6366f1; font-size: 20px;">+</button>
        </div>
        <div class="chat-list" id="chatList">
            <!-- لیست چت‌ها اینجا پر می‌شود -->
        </div>
    </div>

    <!-- محیط چت -->
    <div class="main">
        <div class="header" id="chatHeader" style="display: none; justify-content: space-between;">
            <span id="currentChatName">نام چت</span>
            <div>
                <button class="btn-icon" onclick="showQR()" style="width: 35px; height: 35px; font-size: 12px;">QR</button>
            </div>
        </div>
        
        <div class="messages" id="messagesArea">
            <div class="empty-state">یک چت را انتخاب کنید</div>
        </div>

        <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="msgInput" placeholder="پیام بنویسید..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn-primary" onclick="sendMsg()">ارسال</button>
        </div>
    </div>

    <!-- مودال QR -->
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h3>لینک دعوت</h3>
            <div id="qrcode" class="qr-box"></div>
            <p style="font-size: 12px; color: #aaa; word-break: break-all;" id="linkText"></p>
            <button class="btn-primary" onclick="copyLink()" style="margin-top: 10px; width: 100%;">کپی لینک</button>
            <button onclick="document.getElementById('qrModal').style.display='none'" style="margin-top: 10px; background: #334155; color: white; width: 100%;">بستن</button>
        </div>
    </div>

    <script>
        // --- تنظیمات Firebase ---
        const firebaseConfig = {
            databaseURL: "https://messenger-app-1fb1b-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- شناسایی کاربر ---
        let myId = localStorage.getItem('uid');
        let myName = localStorage.getItem('uname');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substr(2, 9);
            myName = prompt("نام خود را وارد کنید:", "کاربر مهمان") || "کاربر مهمان";
            localStorage.setItem('uid', myId);
            localStorage.setItem('uname', myName);
        }
        document.getElementById('myNameDisplay').innerText = myName;

        // ثبت آنلاین بودن
        db.ref('users/' + myId).set({ name: myName, online: true });

        // --- متغیرها ---
        let currentChatId = null;
        let chats = {};
        let pendingInviteId = null;

        // --- گوش دادن به چت‌ها ---
        db.ref('chats').on('value', (snapshot) => {
            const data = snapshot.val();
            chats = {};
            if (data) {
                Object.keys(data).forEach(key => {
                    if (data[key].members && data[key].members[myId]) {
                        chats[key] = data[key];
                    }
                });
            }
            renderChatList();
        });

        function renderChatList() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            if (Object.keys(chats).length === 0) {
                list.innerHTML = '<div style="padding:20px; text-align:center; color:#64748b;">هنوز چتی ندارید.<br>روی + بزنید.</div>';
                return;
            }
            Object.keys(chats).forEach(id => {
                const chat = chats[id];
                const div = document.createElement('div');
                div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
                div.innerText = chat.name || 'بدون نام';
                div.onclick = () => openChat(id);
                list.appendChild(div);
            });
        }

        // --- باز کردن چت ---
        function openChat(id) {
            currentChatId = id;
            const chat = chats[id];
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('currentChatName').innerText = chat.name;
            renderChatList(); // برای آپدیت کلاس active

            // گوش دادن به پیام‌ها
            db.ref(`chats/${id}/messages`).on('value', (snap) => {
                const msgs = snap.val();
                const area = document.getElementById('messagesArea');
                area.innerHTML = '';
                if (msgs) {
                    Object.values(msgs).forEach(m => {
                        const div = document.createElement('div');
                        div.className = 'msg ' + (m.senderId === myId ? 'sent' : 'received');
                        div.innerText = m.deleted ? '🚫 پیام حذف شد' : m.text;
                        if(!m.deleted && m.senderId === myId) {
                            div.onclick = () => { if(confirm('حذف برای همه؟')) deleteMsg(m.id); };
                            div.style.cursor = 'pointer';
                        }
                        area.appendChild(div);
                    });
                } else {
                    area.innerHTML = '<div class="empty-state">هنوز پیامی نیست</div>';
                }
                area.scrollTop = area.scrollHeight;
            });
        }

        // --- ارسال پیام ---
        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const msgId = db.ref().push().key;
            db.ref(`chats/${currentChatId}/messages/${msgId}`).set({
                id: msgId,
                senderId: myId,
                text: text,
                timestamp: Date.now(),
                deleted: false
            });
            input.value = '';
        }

        // --- حذف پیام ---
        function deleteMsg(msgId) {
            db.ref(`chats/${currentChatId}/messages/${msgId}`).update({ deleted: true, text: '' });
        }

        // --- ساخت چت جدید ---
        function createNewChat() {
            const name = prompt("نام چت یا گروه:");
            if (!name) return;
            const id = db.ref('chats').push().key;
            const members = {};
            members[myId] = myName;
            
            db.ref(`chats/${id}`).set({
                name: name,
                members: members,
                createdAt: Date.now()
            }).then(() => {
                alert("چت ساخته شد! حالا می‌توانید لینک دعوت بگیرید.");
                openChat(id);
            });
        }

        // --- QR Code و لینک دعوت ---
        function showQR() {
            if (!currentChatId) return;
            const modal = document.getElementById('qrModal');
            const container = document.getElementById('qrcode');
            const linkTxt = document.getElementById('linkText');
            
            container.innerHTML = '';
            const url = window.location.origin + window.location.pathname + '?invite=' + currentChatId;
            linkTxt.innerText = url;
            
            new QRCode(container, { text: url, width: 200, height: 200 });
            modal.style.display = 'flex';
        }

        function copyLink() {
            const txt = document.getElementById('linkText').innerText;
            navigator.clipboard.writeText(txt);
            alert("لینک کپی شد!");
        }

        // --- بررسی لینک دعوت (مهمترین بخش) ---
        function checkInvite() {
            const params = new URLSearchParams(window.location.search);
            const invId = params.get('invite');
            
            if (invId) {
                // پاک کردن لینک از آدرس بار
                window.history.replaceState({}, document.title, window.location.pathname);
                
                db.ref(`chats/${invId}`).once('value').then((snap) => {
                    if (snap.exists()) {
                        const chat = snap.val();
                        // اگر قبلا عضو نیستیم
                        if (!chat.members || !chat.members[myId]) {
                            pendingInviteId = invId;
                            document.getElementById('inviteText').innerText = `دعوت به "${chat.name}"`;
                            document.getElementById('inviteBanner').style.display = 'flex';
                        } else {
                            openChat(invId);
                        }
                    } else {
                        alert("لینک دعوت نامعتبر است یا چت حذف شده.");
                    }
                });
            }
        }

        function acceptInvite() {
            if (pendingInviteId) {
                const membersUpdate = {};
                membersUpdate[myId] = myName;
                db.ref(`chats/${pendingInviteId}/members`).update(membersUpdate).then(() => {
                    document.getElementById('inviteBanner').style.display = 'none';
                    openChat(pendingInviteId);
                    alert("به چت اضافه شدید!");
                });
            }
        }

        // شروع برنامه
        checkInvite();

    </script>
</body>
</html>
