                showToast('لطفاً نام گروه را وارد کنید', 'error');
                return;
            }

            const newGroup = {
                id: Date.now(),
                name: name,
                type: 'group',
                description: description,
                members: ['من', ...members],
                messages: []
            };

            chats.unshift(newGroup);
            renderChatList();
            saveData();
            closeModal('createGroupModal');

            document.getElementById('groupName').value = '';
            document.getElementById('groupDescription').value = '';
            document.getElementById('groupMembers').value = '';

            showToast('گروه ایجاد شد', 'success');
        }

        function createNewChat() {
            const partner = document.getElementById('chatPartner').value.trim();

            if (!partner) {
                showToast('لطفاً نام شخص را وارد کنید', 'error');
                return;
            }

            const newChat = {
                id: Date.now(),
                name: partner,
                type: 'private',
                members: ['من', partner],
                messages: []
            };

            chats.unshift(newChat);
            renderChatList();
            saveData();
            closeModal('newChatModal');
            document.getElementById('chatPartner').value = '';
            showToast('چت ایجاد شد', 'success');
        }

        // ============ Modals ============
        function showCreateGroupModal() {
            document.getElementById('createGroupModal').classList.add('active');
        }

        function showNewChatModal() {
            document.getElementById('newChatModal').classList.add('active');
        }

        function showQRCode() {
            if (!currentChat) return;
            document.getElementById('qrModal').classList.add('active');
            generateQRCode();
        }

        function showChatInfo() {
            if (!currentChat) return;
            
            const content = document.getElementById('chatInfoContent');
            content.innerHTML = `
                <p><strong>نام:</strong> ${escapeHtml(currentChat.name)}</p>
                <p><strong>نوع:</strong> ${currentChat.type === 'group' ? 'گروه' : 'چت خصوصی'}</p>
                <p><strong>اعضا:</strong> ${escapeHtml(currentChat.members.join(', '))}</p>
                <p><strong>تعداد پیام‌ها:</strong> ${currentChat.messages.length}</p>
            `;
            
            document.getElementById('chatInfoModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function deleteChat() {
            if (!currentChat) return;
            
            if (confirm('آیا مطمئن هستید که می‌خواهید این چت را حذف کنید؟')) {
                chats = chats.filter(c => c.id !== currentChat.id);
                currentChat = null;
                document.getElementById('chatHeader').style.display = 'none';
                document.getElementById('inputArea').style.display = 'none';
                document.getElementById('messagesContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">💬</div>
                        <div class="empty-state-text">یک چت را انتخاب کنید</div>
                        <div class="empty-state-subtext">یا یک چت جدید ایجاد کنید</div>
                    </div>
                `;
                renderChatList();
                saveData();
                closeModal('chatInfoModal');
                showToast('چت حذف شد', 'success');
                
                // Mobile: show sidebar
                if (window.innerWidth <= 768) {
                    document.getElementById('sidebar').classList.remove('hidden');
                }
            }
        }

        // ============ QR Code ============
        function generateQRCode() {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 220;
            canvas.height = 220;

            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 220, 220);

            // Seed based on chat id for consistency
            const seed = currentChat ? currentChat.id : 1;
            let random = seed;
            const seededRandom = () => {
                random = (random * 9301 + 49297) % 233280;
                return random / 233280;
            };

            ctx.fillStyle = '#1e1b4b';
            const size = 11;
            for (let i = 0; i < 20; i++) {
                for (let j = 0; j < 20; j++) {
                    if (seededRandom() > 0.5) {
                        ctx.fillRect(i * size, j * size, size, size);
                    }
                }
            }

            // Corner squares
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, 0, 77, 77);
            ctx.fillRect(143, 0, 77, 77);
            ctx.fillRect(0, 143, 77, 77);
            
            ctx.fillStyle = 'white';
            ctx.fillRect(11, 11, 55, 55);
            ctx.fillRect(154, 11, 55, 55);
            ctx.fillRect(11, 154, 55, 55);
            
            ctx.fillStyle = '#6366f1';
            ctx.fillRect(22, 22, 33, 33);
            ctx.fillRect(165, 22, 33, 33);
            ctx.fillRect(22, 165, 33, 33);
        }

        // ============ Emoji Picker ============
        function toggleEmojiPicker(event) {
            event.stopPropagation();
            document.getElementById('emojiPicker').classList.toggle('active');
        }

        function insertEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
        }

        // ============ Utilities ============
        function getCurrentTime() {
            const now = new Date();
            return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ============ Start ============
        initializeApp();
    </script>
</body>
</html>
